[workspace]
members  = ["crates/ck-gpu", "crates/ck"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["jer"]

[workspace.lints.clippy]
pedantic = {level = "warn", priority = -1}
cast_possible_truncation = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"
cast_possible_wrap       = "allow"

[profile.dev]
opt-level = 2
