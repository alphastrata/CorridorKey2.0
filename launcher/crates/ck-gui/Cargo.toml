[package]
name = "ck-gui"
edition.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
ahash = "0.8.12"
argh = "0.1.19"
color-eyre = "0.6.5"
dirs = "7.0.0"
eyre = "0.6.14"
flume = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["exr", "jpeg", "png", "rayon", "tiff", "webp"] }
nvml-wrapper = "0.13.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
sysinfo = "0.39.6"
toml = "1.1.8"

[lints.clippy]
pedantic                  = {level = "warn", priority = -1}
perf                      = {level = "deny", priority = -1}
missing_errors_doc        = "allow"
missing_safety_doc        = "allow"
missing_panics_doc        = "allow"
needless_for_each         = "allow"

[build-dependencies]
slint-build = "1.18.1"

[target."cfg(unix)".dependencies]
ck-ipc = { version = "0.1.0", path = "../ck-ipc" }
nix = { version = "0.31.3", features = ["signal", "process"] }

[[bench]]
name = "convert"
harness = false
