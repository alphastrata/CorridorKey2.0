[package]
name              = "ck_attn"
edition.workspace = true
version.workspace = true

[package.metadata.ck]
archs         = [75, 120]
launch_bounds = {75 = [256, 1], 120 = [128, 1]}

[lib]
crate-type = ["cdylib"]

[features]
default = []
sm_75   = ["ptx/sm_75", "ck_arch/sm_75"]
sm_120  = ["ptx/sm_120", "ck_arch/sm_120"]

[dependencies]
ck_arch = {path = "../ck_arch"}
ptx = {workspace = true, default-features = false}

[lints]
workspace = true
