[package]
name              = "ck_ops"
edition.workspace = true
license.workspace = true
version.workspace = true

[package.metadata.ptx]
launch_bounds = [256, 4]
entry_bounds  = {refine_conv = {61 = [256, 4], 75 = [256, 4], 80 = [256, 2], 90a = [256, 2], 100a = [256, 2], 120 = [256, 2]}, refine_in = {61 = [256, 2], 75 = [256, 2], 80 = [256, 2], 90a = [256, 2], 100a = [256, 2], 120 = [256, 2]}, refine_mma = {75 = [256, 2], 80 = [256, 2], 90a = [256, 2], 100a = [256, 2], 120 = [256, 2]}}

[lib]
crate-type = ["cdylib", "rlib"]

[features]
device   = ["dep:ptx", "ck_arch/device"]
default = ["device"]
sm_61   = ["device", ]
sm_75   = ["device", "ptx/sm_75"]
sm_80   = ["device", "ptx/sm_80"]
sm_90a  = ["device", "sm_80", "ptx/sm_90"]
sm_100a = ["device", "sm_80", "ptx/sm_100"]
sm_120  = ["device", "sm_80", "ptx/sm_120"]

[dependencies]
ck_arch = {path = "../ck_arch", default-features = false}
ptx = {workspace = true, default-features = false, optional = true}

[lints.clippy]
pedantic                  = {level = "warn", priority = -1}
perf                      = {level = "deny", priority = -1}
missing_errors_doc        = "allow"
missing_safety_doc        = "allow"
missing_panics_doc        = "allow"

[[bench]]
name = "bits"
harness = false
