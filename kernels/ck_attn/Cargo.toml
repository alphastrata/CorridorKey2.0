[package]
name              = "ck_attn"
edition.workspace = true
license.workspace = true
version.workspace = true

[package.metadata.ptx]
launch_bounds = {61 = [256, 1], 75 = [256, 1], 80 = [128, 1], 90a = [128, 1], 100a = [128, 1], 120 = [128, 1]}

[lib]
crate-type = ["cdylib"]

[features]
default = []
sm_61   = ["ck_arch/sm_61"]
sm_75   = ["ptx/sm_75", "ck_arch/sm_75"]
sm_80   = ["ptx/sm_80", "ck_arch/sm_80"]
sm_90a  = ["sm_80", "ptx/sm_90", "ck_arch/sm_90a"]
sm_100a = ["sm_80", "ptx/sm_100", "ck_arch/sm_100a"]
sm_120  = ["sm_80", "ptx/sm_120", "ck_arch/sm_120"]

[dependencies]
ck_arch = {path = "../ck_arch"}
ptx = {workspace = true, default-features = false}

[lints]
workspace = true
