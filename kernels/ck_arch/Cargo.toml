[package]
name              = "ck_arch"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
device   = ["dep:ptx"]
default = []
sm_61   = []
sm_75   = ["dep:ptx", "ptx/sm_75"]
sm_80   = ["dep:ptx", "ptx/sm_80"]
sm_90a  = ["sm_80", "ptx/sm_90"]
sm_100a = ["sm_80", "ptx/sm_100"]
sm_120  = ["sm_80", "ptx/sm_120"]

[dependencies]
ptx = {workspace = true, default-features = false, optional = true}

[lints.clippy]
pedantic                  = {level = "warn", priority = -1}
perf                      = {level = "deny", priority = -1}
missing_errors_doc        = "allow"
missing_safety_doc        = "allow"
missing_panics_doc        = "allow"

[[bench]]
name = "convert"
harness = false
