[package]
name = "ck-gui"
edition.workspace = true
version.workspace = true
authors.workspace = true

[dependencies]
ahash = "0.8.12"
color-eyre = "0.6.5"
dirs = "7.0.0"
eyre = "0.6.14"
flume = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["exr", "jpeg", "png", "rayon", "tiff", "webp"] }
nvml-wrapper = "0.13.0"
rfd = "0.17.2"
rkyv = "0.8.18"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
sysinfo = "0.39.6"

[lints]
workspace = true

[build-dependencies]
slint-build = "1.18.1"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal", "process"] }
