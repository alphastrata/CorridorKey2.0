[package]
name              = "ck_gemm"
edition.workspace = true
version.workspace = true

[package.metadata.ck]
archs         = [75, 120]
launch_bounds = {75 = [256, 1], 120 = [256, 1]}
entry_bounds  = {gemm_square = {75 = [256, 2], 120 = [256, 2]}, gemm_thin = {75 = [256, 2], 120 = [256, 3]}, gemm_small = {75 = [256, 2], 120 = [256, 3]}}

[lib]
crate-type = ["cdylib"]

[features]
default = []
sm_75   = ["ptx/sm_75", "ck_arch/sm_75"]
sm_120  = ["ptx/sm_120", "ck_arch/sm_120"]

[dependencies]
ck_arch = {path = "../ck_arch"}
ptx = {workspace = true, default-features = false}

[lints]
workspace = true
