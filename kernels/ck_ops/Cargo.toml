[package]
name              = "ck_ops"
edition.workspace = true
version.workspace = true

[package.metadata.ptx]
launch_bounds = [256, 4]
entry_bounds  = {refine_conv = {61 = [256, 4], 75 = [256, 4], 80 = [256, 2], 90a = [256, 2], 100a = [256, 2], 120 = [256, 2]}, refine_in = {61 = [256, 2], 75 = [256, 2], 80 = [256, 2], 90a = [256, 2], 100a = [256, 2], 120 = [256, 2]}, refine_mma = {75 = [256, 2], 80 = [256, 2], 90a = [256, 2], 100a = [256, 2], 120 = [256, 2]}}

[lib]
crate-type = ["cdylib"]

[features]
default = []
sm_61   = []
sm_75   = ["ptx/sm_75"]
sm_80   = ["ptx/sm_80"]
sm_90a  = ["sm_80", "ptx/sm_90"]
sm_100a = ["sm_80", "ptx/sm_100"]
sm_120  = ["sm_80", "ptx/sm_120"]

[dependencies]
ptx = {workspace = true, default-features = false}

[lints]
workspace = true
