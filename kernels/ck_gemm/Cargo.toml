[package]
name              = "ck_gemm"
edition.workspace = true
version.workspace = true

[package.metadata.ptx]
launch_bounds = {61 = [256, 1], 75 = [256, 1], 80 = [256, 1], 86 = [256, 1], 89 = [256, 1], 90a = [256, 1], 100a = [256, 1], 120 = [256, 1]}
entry_bounds  = {gemm_hopper = {90a = [256, 2]}, gemm_blackwell = {100a = [256, 2]}, gemm_square = {61 = [256, 2], 75 = [256, 2], 80 = [256, 2], 86 = [256, 2], 89 = [256, 2], 90a = [256, 2], 100a = [256, 2], 120 = [256, 2]}, gemm_thin = {61 = [256, 2], 75 = [256, 2], 80 = [256, 3], 86 = [256, 3], 89 = [256, 3], 90a = [256, 3], 100a = [256, 3], 120 = [256, 3]}, gemm_small = {61 = [256, 2], 75 = [256, 2], 80 = [256, 3], 86 = [256, 3], 89 = [256, 3], 90a = [256, 3], 100a = [256, 3], 120 = [256, 3]}, gemm_simt = {61 = [256, 2], 75 = [256, 2], 80 = [256, 2], 86 = [256, 2], 89 = [256, 2], 90a = [256, 2], 100a = [256, 2], 120 = [256, 2]}}

[lib]
crate-type = ["cdylib"]

[features]
default = []
sm_61   = ["ck_arch/sm_61"]
sm_75   = ["ptx/sm_75", "ck_arch/sm_75"]
sm_80   = ["ptx/sm_80", "ck_arch/sm_80"]
sm_86   = ["sm_80", "ptx/sm_86", "ck_arch/sm_86"]
sm_89   = ["sm_80", "ptx/sm_89", "ck_arch/sm_89"]
sm_90a  = ["sm_80", "ptx/sm_90", "ck_arch/sm_90a"]
sm_100a = ["sm_80", "ptx/sm_100", "ck_arch/sm_100a"]
sm_120  = ["sm_80", "ptx/sm_120", "ck_arch/sm_120"]

[dependencies]
ck_arch = {path = "../ck_arch"}
ptx = {workspace = true, default-features = false}

[lints]
workspace = true
