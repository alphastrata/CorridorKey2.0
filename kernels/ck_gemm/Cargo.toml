[package]
name              = "ck_gemm"
edition.workspace = true
version.workspace = true

[package.metadata.ptx]
launch_bounds = {61 = [256, 1], 75 = [256, 1], 80 = [256, 1], 120 = [256, 1]}
entry_bounds  = {gemm_square = {61 = [256, 2], 75 = [256, 2], 80 = [256, 2], 120 = [256, 2]}, gemm_thin = {61 = [256, 2], 75 = [256, 2], 80 = [256, 3], 120 = [256, 3]}, gemm_small = {61 = [256, 2], 75 = [256, 2], 80 = [256, 3], 120 = [256, 3]}, gemm_simt = {61 = [256, 2], 75 = [256, 2], 80 = [256, 2], 120 = [256, 2]}}

[lib]
crate-type = ["cdylib"]

[features]
default = []
sm_61   = ["ck_arch/sm_61"]
sm_75   = ["ptx/sm_75", "ck_arch/sm_75"]
sm_80   = ["ptx/sm_80", "ck_arch/sm_80"]
sm_120  = ["sm_80", "ptx/sm_120", "ck_arch/sm_120"]

[dependencies]
ck_arch = {path = "../ck_arch"}
ptx = {workspace = true, default-features = false}

[lints]
workspace = true
