[project]
name = "corridorkey2"
version = "2.0.0"
requires-python = ">=3.13, <3.14"
dependencies = [
    "einops>=0.8",
    "huggingface-hub>=0.36",
    "numpy>=1.26,<2",
    "opencv-python>=4.11",
    "pillow>=11",
    "safetensors>=0.6",
    "scipy>=1.16",
    "timm>=1.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm>=4.67",
    "transformers>=4.57,<5",
    "utils3d",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "83bfa5bda008803f6521ce9547f94023b8afeddd" }
