[workspace]
members  = ["crates/ck-gpu", "crates/ck", "crates/ck-gui", "crates/ck-ipc"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["jer"]

[workspace.lints.clippy]
pedantic            = {level = "warn", priority = -1}
perf                = {level = "deny", priority = -1}
missing_errors_doc  = "allow"

[profile.dev]
opt-level = 2
