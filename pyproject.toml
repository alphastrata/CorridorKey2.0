[project]
name = "corridorkey2"
version = "2.0.0"
requires-python = ">=3.13, <3.14"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=2.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0",
    "pillow>=13",
    "safetensors>=0.8",
    "scipy>=1.18.1",
    "timm>=1.0.30",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "utils3d",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["T201", "E402", "B010"]
"corridorkey/ptx/*" = ["B010"]
"corridorkey/runtime.py" = ["T201"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "83bfa5bda008803f6521ce9547f94023b8afeddd" }
